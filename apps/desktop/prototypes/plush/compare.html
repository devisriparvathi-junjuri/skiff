<style>
:root { --u: 1px; }
* { box-sizing: border-box; }
body { margin: 0; font: 13px -apple-system, system-ui, sans-serif; background: #0b0d10; }
.bar { padding: 10px 16px; color: #ccd; font-size: 12px; } .bar label { cursor: pointer; }
body.still .skipper-face * { animation: none !important; }
.sheets { display: flex; flex-wrap: wrap; }
.sheet { padding: 22px 28px 30px; flex: 1 0 auto; }
.dark { background: #0f1216; color: #d8dde6; --dim: #7d8796; --strip: #151a20; --line: #232a34; }
.light { background: #f5f6f8; color: #1d2430; --dim: #6b7482; --strip: #eceef2; --line: #dde1e7; }
h2 { margin: 0 0 16px; font-size: 15px; }
.strips { display: flex; gap: 24px; justify-content: center; }
.strip { width: 280px; background: var(--strip); border: 1px solid var(--line); border-radius: 14px; padding: 18px 0 8px;
  display: flex; flex-direction: column; align-items: center; }
h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .14em; text-align: center; }
h3 small { display: block; letter-spacing: 0; font-weight: 400; color: var(--dim); font-size: 11.5px; margin-top: 3px; }
figure { margin: 0; padding: 22px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
figure + figure { border-top: 1px solid var(--line); width: 100%; }
figcaption { text-align: center; } figcaption b { font-size: 14px; }
figcaption small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.only-dark .light, .only-light .dark { display: none; }
.skipper-face { width: calc(var(--face) * var(--u)); height: calc(var(--face) * var(--u)); flex-shrink: 0; display: inline-block; line-height: 0; }
.skipper-face svg { display: block; width: 100%; height: 100%; }
/* Living faces. The eyes blink: they squash flat for about 150 ms, in
   steps. Now and then the head turns. The front moves as one, on one
   centerline: the visor, the eyes centered in it, and the Admiral's
   button slide 1.5 units and narrow a little (92 %) as their far side
   goes back. The depth comes from what stays back: the whole face narrows
   to 97 % toward the near side, with no rotation, so the centerline stays
   upright, and the Admiral's crown and band slide only 0.5 and narrow to 97 %.
   Eased in and out over about 250 ms, held about 1.2 s, then back. A cycle
   holds three turns: one side, the other side, then up. Each face's rhythm
   comes in its SVG's variables (skipperAvatar.ts). Done and no-session
   faces sleep, and reduced motion stops all of it. */
.skipper-face .sk-eyes { transform-box: fill-box; transform-origin: center; animation: var(--blink-anim, sk-blink) var(--blink, 5s) var(--blink-delay, 0s) infinite steps(1, end); }
.skipper-face :is(.sk-turn, .sk-cap, .sk-front) { animation-duration: var(--face-turn, 42s); animation-delay: var(--face-turn-delay, 0s); animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.skipper-face .sk-turn { transform-origin: 16px 16px; animation-name: sk-lean; }
.skipper-face .sk-cap { transform-box: fill-box; transform-origin: center; animation-name: sk-capslide; }
.skipper-face .sk-front { transform-box: fill-box; transform-origin: center; animation-name: sk-slide; }
@keyframes sk-blink { 0% { transform: scaleY(1); } 97.4% { transform: scaleY(0.1); } 100% { transform: scaleY(1); } }
@keyframes sk-blink2 { 0% { transform: scaleY(1); } 93.6% { transform: scaleY(0.1); } 95.4% { transform: scaleY(1); } 97.4% { transform: scaleY(0.1); } 100% { transform: scaleY(1); } }
/* the three turns, at 30 %, 63 % and 96 % of the cycle: 0.6 % in, 2.9 % held, 0.6 % back */
@keyframes sk-lean {
  0%, 30%, 34.1%, 63%, 67.1%, 100% { transform: translate(0, 0) scaleX(1); }
  30.6%, 33.5% { transform: translate(calc(var(--dir, 1) * 0.45px), 0) scaleX(0.97); }
  63.6%, 66.5% { transform: translate(calc(var(--dir, 1) * -0.45px), 0) scaleX(0.97); }
}
@keyframes sk-capslide {
  0%, 30%, 34.1%, 63%, 67.1%, 95%, 99.1%, 100% { transform: translate(0, 0) scaleX(1); }
  30.6%, 33.5% { transform: translate(calc(var(--dir, 1) * 0.5px), 0) scaleX(0.97); }
  63.6%, 66.5% { transform: translate(calc(var(--dir, 1) * -0.5px), 0) scaleX(0.97); }
  95.6%, 98.5% { transform: translate(0, -0.5px) scaleX(1); }
}
@keyframes sk-slide {
  0%, 30%, 34.1%, 63%, 67.1%, 95%, 99.1%, 100% { transform: translate(0, 0) scaleX(1); }
  30.6%, 33.5% { transform: translate(calc(var(--dir, 1) * 1.5px), 0) scaleX(0.92); }
  63.6%, 66.5% { transform: translate(calc(var(--dir, 1) * -1.5px), 0) scaleX(0.92); }
  95.6%, 98.5% { transform: translate(0, -1px) scaleX(1); }
}
:is(.st-done, .sk-row:not([data-session]), .skiff-agent-row:not([data-session])) .skipper-face :is(.sk-eyes, .sk-look, .sk-front, .sk-cap, .sk-turn) { animation: none; }
@media (prefers-reduced-motion: reduce) { .skipper-face :is(.sk-eyes, .sk-look, .sk-front, .sk-cap, .sk-turn) { animation: none; } }
